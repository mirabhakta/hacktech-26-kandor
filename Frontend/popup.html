<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <link rel="icon" type="image/png" href="icon.png" />
    <title>Kandor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #f6f7f9;
        --surface: #ffffff;
        --border: #e3e7ec;
        --text: #111827;
        --muted: #667085;
        --accent: #4f46e5;
        --accent-soft: #eef2ff;
        --safe: #027a48;
        --safe-soft: #ecfdf3;
        --warn: #b54708;
        --warn-soft: #fffaeb;
        --danger: #b42318;
        --danger-soft: #fef3f2;
        --radius: 14px;
        --shadow: 0 16px 40px -24px rgba(16, 24, 40, .2);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 400px;
        min-height: 620px;
        padding: 14px;
        background: var(--bg);
        color: var(--text);
        font-family: "Inter", system-ui, sans-serif;
      }
      .stack { display: flex; flex-direction: column; gap: 12px; }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 16px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 4px;
      }
      .brand-mark {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: linear-gradient(135deg, #4f46e5, #7c3aed);
        color: #fff;
        display: grid;
        place-items: center;
        font-family: "Fraunces", serif;
        font-weight: 700;
      }
      .brand h1 {
        margin: 0;
        font-family: "Fraunces", serif;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .brand p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
      .status-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 10px;
      }
      .status-title { font-weight: 700; font-size: 15px; }
      .pill {
        display: inline-flex;
        align-items: center;
        padding: 5px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
      }
      .pill-safe { background: var(--safe-soft); color: var(--safe); }
      .pill-warn { background: var(--danger-soft); color: var(--danger); }
      .metrics {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
        margin: 10px 0;
      }
      .metric {
        padding: 10px;
        border-radius: 10px;
        background: var(--bg);
        border: 1px solid var(--border);
      }
      .metric label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 3px; }
      .metric strong { font-size: 15px; }
      .muted { color: var(--muted); font-size: 13px; line-height: 1.5; }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
      .chip {
        padding: 5px 9px;
        border-radius: 999px;
        background: var(--warn-soft);
        color: var(--warn);
        font-size: 12px;
        font-weight: 600;
        border: 1px solid #fedf89;
      }
      .evidence { display: flex; flex-direction: column; gap: 8px; max-height: 220px; overflow: auto; }
      .evidence-item {
        padding: 10px;
        border-radius: 10px;
        background: var(--bg);
        border: 1px solid var(--border);
        font-size: 13px;
      }
      .evidence-item strong { display: block; margin-bottom: 4px; }
      details { border-radius: 12px; border: 1px solid var(--border); background: var(--bg); overflow: hidden; }
      summary {
        cursor: pointer;
        padding: 12px 14px;
        font-weight: 600;
        font-size: 14px;
        list-style: none;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      summary::-webkit-details-marker { display: none; }
      .settings-body { padding: 0 14px 14px; border-top: 1px solid var(--border); }
      label { display: block; margin: 10px 0 5px; font-size: 12px; color: var(--muted); font-weight: 600; }
      input[type="text"], input[type="number"] {
        width: 100%;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--surface);
        font: inherit;
        font-size: 13px;
      }
      input:focus { outline: 3px solid #c7d2fe; border-color: var(--accent); }
      .toggle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px;
        border-radius: 10px;
        background: var(--surface);
        border: 1px solid var(--border);
        margin-top: 10px;
      }
      .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
      button {
        width: 100%;
        padding: 10px 12px;
        border-radius: 10px;
        border: 0;
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        background: var(--accent);
        color: #fff;
      }
      button.secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
      button:hover { opacity: .92; }
      button:focus-visible { outline: 3px solid #c7d2fe; outline-offset: 2px; }
      .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #c7d2fe; border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; margin-right: 8px; vertical-align: middle; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="stack">
      <section class="card">
        <div class="brand">
          <div class="brand-mark">K</div>
          <div>
            <h1>Kandor</h1>
            <p>Conversation safety review</p>
          </div>
        </div>
        <div class="status-row">
          <div class="status-title">Current tab</div>
          <span id="resultPill" class="pill pill-safe">Idle</span>
        </div>
        <div id="lastResult" class="muted">No scan has been completed for this tab.</div>
      </section>

      <section class="card">
        <div class="status-title" style="margin-bottom:8px;">Actions</div>
        <div class="actions">
          <button id="scanNow" class="button primary" type="button">Scan tab now</button>
          <button id="clearReports" class="secondary" type="button">Clear reports</button>
        </div>
        <button id="openDashboard" class="secondary" type="button" style="width:100%;margin-top:8px;">Open parent dashboard</button>
      </section>

      <details id="editSettings" class="settings">
        <summary>
          <span>Settings</span>
          <span>Configure</span>
        </summary>
        <div class="settings-body">
          <label class="toggle" for="enabled">
            <span>Enable scanning</span>
            <input id="enabled" type="checkbox" />
          </label>
          <label for="backendBaseUrl">Backend URL</label>
          <input id="backendBaseUrl" type="text" value="http://127.0.0.1:8000" />
          <label for="scanIntervalMinutes">Scan interval (minutes)</label>
          <input id="scanIntervalMinutes" type="number" min="1" value="1" />
          <label for="warningThreshold">Warning threshold</label>
          <input id="warningThreshold" type="number" min="0" max="100" value="40" />
          <button id="save" type="button" style="margin-top:12px;">Save settings</button>
        </div>
      </details>
    </div>

    <script src="constants.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
