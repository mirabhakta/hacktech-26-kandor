name: tests

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r Backend/requirements.txt
          pip install pytest
      - name: Run tests
        env:
          KANDOR_PROVIDER: rules
          PYTHONPATH: Backend
        run: pytest tests -q